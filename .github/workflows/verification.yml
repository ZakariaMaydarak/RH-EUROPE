# Vérification de chaque PR (vers dev / main) — NE DÉPLOIE PAS.
# Le déploiement se fait par la page « Déploiements » du portail (voir README.md).
name: Verification (no deploy)

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntaxe Python du serveur
        run: python -m compileall -q serveur

      - name: Tests du serveur (portail simule)
        run: |
          pip install Flask==3.0.3 openpyxl==3.1.5 tzdata
          python serveur/RHEUROPE/tests/test_rheurope.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build du front
        working-directory: front
        run: |
          npm install
          npm run build
